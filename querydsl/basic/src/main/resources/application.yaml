spring:
  application:
    name: basic
  # 데이터베이스 설정
  datasource:
    url: jdbc:h2:tcp://localhost/D:/database/h2/data/querydsl
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create
    # show-sql: true
    properties:
      hibernate:
        format_sql: true
# 로그 설정
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace