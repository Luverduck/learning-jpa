spring:
  application:
    name: basic
  # 데이터베이스 설정
  datasource:
    url: jdbc:h2:../data/jpashop
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        # show_sql: true
        format_sql: true
# 로깅 설정
logging:
  level:
    org.hibernate:
      SQL: DEBUG
      type : trace